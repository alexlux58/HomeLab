---
openbao_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/openbao_ed25519"
openbao_known_hosts_file: "{{ playbook_dir }}/../../artifacts/openbao_known_hosts"

openbao_version: "2.6.1"
openbao_release_key_fingerprint: "66D15FDD87287219C8E15478D200CD702853E6D0"
openbao_api_dns_name: bao.lab.example.com
openbao_api_vip: 192.168.0.40
openbao_domain: lab.example.com
openbao_lan_cidr: 192.168.0.0/24
openbao_observability_ip: 192.168.0.31
openbao_synology_ip: 192.168.0.20
# DSM Terminal SSH/SFTP moved off 22 on 2026-08-25; 22 is closed.
openbao_synology_ssh_port: 2258
openbao_synology_backup_user: openbao-backup
openbao_synology_backup_path: /volume1/OpenBaoBackups/raft

openbao_cluster_members:
  - name: bao-1
    address: 192.168.0.41
  - name: bao-2
    address: 192.168.0.42
  - name: bao-3
    address: 192.168.0.43

openbao_tls_controller_root: "{{ lookup('env', 'HOME') }}/.local-credentials/home-lab/openbao/pki"
openbao_operator_token_file: "{{ lookup('env', 'HOME') }}/.local-credentials/home-lab/openbao/operator.token"
openbao_backup_age_recipient_file: /etc/openbao/backup/age-recipient.txt
openbao_backup_sftp_key_file: /etc/openbao/backup/id_ed25519
openbao_backup_sftp_known_hosts_file: /etc/openbao/backup/known_hosts
openbao_backup_agent_token_file: /run/openbao-agent-backup/token
openbao_backup_approle_role_id_file: /etc/openbao/agent/backup/role-id
openbao_backup_approle_secret_id_file: /etc/openbao/agent/backup/secret-id

allow_prepare_openbao_hosts: false
prepare_openbao_hosts_confirmation: ""
allow_install_openbao: false
install_openbao_confirmation: ""
allow_configure_openbao_tls: false
configure_openbao_tls_confirmation: ""
allow_configure_openbao_ha: false
configure_openbao_ha_confirmation: ""
allow_configure_openbao_post_init: false
configure_openbao_post_init_confirmation: ""
allow_configure_openbao_backup: false
configure_openbao_backup_confirmation: ""
allow_configure_openbao_monitoring: false
configure_openbao_monitoring_confirmation: ""
allow_run_openbao_backup: false
run_openbao_backup_confirmation: ""
