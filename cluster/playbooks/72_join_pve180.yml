---
# Stage 9c — join the rebuilt .12.
#
#   make join-180 EXTRA="-e allow_join_pve180=true \
#     -e join_confirmation_pve180='JOIN pve2 192.168.0.12 TO homelab'"
- name: Join .12 to the cluster
  hosts: pve2
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  tags: [stage9, join]

  pre_tasks:
    - name: Require the reinstalled node's fingerprint to have been verified
      ansible.builtin.assert:
        that:
          - pve180_fingerprint_verified | bool
        fail_msg: "Verify the new SSH host fingerprint before joining (docs/reinstall-ssh-recovery.md)."

  roles:
    - role: ssh_validation

    - role: pve_join
      pve_join_allow: "{{ allow_join_pve180 }}"
      pve_join_confirmation: "{{ join_confirmation_pve180 }}"
      pve_join_confirmation_required: "{{ join_confirmation_pve180_required }}"
      pve_join_executed: "{{ pve180_join_executed }}"
      pve_join_allow_var: allow_join_pve180
      pve_join_confirmation_var: join_confirmation_pve180
      pve_join_executed_var: pve180_join_executed

  post_tasks:
    - name: Confirm three-node quorum
      ansible.builtin.command: pvecm status
      changed_when: false
      delegate_to: "{{ cluster_seed_host }}"
      register: join180_status

    - name: Assert three nodes and quorum
      ansible.builtin.assert:
        that:
          - (join180_status.stdout | regex_search('Total votes:\\s+(\\d+)', '\\1') | first | int) == 3
          - join180_status.stdout is search('Quorate:\\s+Yes')
        fail_msg: |
          The cluster does not report three quorate nodes:
          {{ join180_status.stdout }}
        success_msg: "Three-node quorum established."

    - name: Report
      ansible.builtin.debug:
        msg:
          - "{{ join180_status.stdout_lines | select('search', '(Nodes|Total votes|Quorate)') | list }}"
          - "Next: run `make validate`; rebuild cataloged services later as new workloads."
