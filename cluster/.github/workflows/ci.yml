---
name: ci

# Offline by design. Nothing in this workflow can reach 192.168.0.0/24: there
# are no credentials, no VPN and no inventory targets outside the repository.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  ANSIBLE_CONFIG: ansible.cfg

jobs:
  python:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install controller tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ruff check
        run: ruff check scripts tests roles/discovery/files

      - name: ruff format check
        run: ruff format --check scripts tests

      - name: pytest (offline unit tests + repository safety checks)
        run: pytest -q

  ansible:
    name: yamllint + ansible-lint + inventory schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install controller tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint -s .

      - name: ansible-lint
        run: ansible-lint

      - name: Inventory parses without contacting anything
        run: ansible-inventory -i inventory/hosts.yml --list > /dev/null

      - name: Playbook syntax check
        run: |
          for pb in playbooks/*.yml; do
            echo "--- $pb"
            ansible-playbook -i inventory/hosts.yml --syntax-check "$pb"
          done

      - name: Confirm no playbook would contact a real host in CI
        run: |
          ! grep -RnE '^\s*ansible_(ssh_)?pass' inventory/ playbooks/ roles/
          ! grep -RnE 'StrictHostKeyChecking[= ]no' . --exclude-dir=.git

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck all shell scripts
        run: |
          mapfile -t files < <(find roles scripts -name '*.sh' -type f)
          if [ ${#files[@]} -eq 0 ]; then echo "no shell scripts"; exit 0; fi
          shellcheck -S style "${files[@]}"

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml

      - name: Fail if any private key or credential file was committed
        run: |
          set -euo pipefail
          bad=$(git ls-files \
            | grep -E '(^|/)(id_rsa|id_ed25519|id_ecdsa|.*\.pem|.*\.key|known_hosts|authorized_keys|.*\.pw)$' \
            || true)
          if [ -n "$bad" ]; then
            echo "Credential-like files are committed:"; echo "$bad"; exit 1
          fi
          echo "No credential files committed."

  gates:
    name: destructive-task approval validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Every destructive task is gated and every approval defaults to refuse
        run: pytest -q -m repo tests/test_repo_safety.py tests/test_inventory_schema.py
