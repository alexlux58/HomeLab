---
modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      follow_redirects: true
      preferred_ip_protocol: ip4

  http_2xx_internal_tls:
    prober: http
    timeout: 10s
    http:
      method: GET
      follow_redirects: true
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: true

  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4

  dns_lab:
    prober: dns
    timeout: 5s
    dns:
      # Must match a real NPM vhost, not a wildcard-only name.
      query_name: home.lab.example.com
      query_type: A
      preferred_ip_protocol: ip4
      validate_answer_rrs:
        fail_if_not_matches_regexp:
          - ^home\.lab\.example\.com\..*192\.168\.0\.30
