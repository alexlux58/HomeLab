---
global:
  scrape_interval: 60s
  scrape_timeout: 15s
  evaluation_interval: 30s
  external_labels:
    site: homelab

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    scrape_interval: 30s
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: observability-containers
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          host: observability

  - job_name: observability-node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: observability

  - job_name: node-exporter
    file_sd_configs:
      - files: ["/etc/prometheus/file_sd/node-exporter.yml"]
        refresh_interval: 5m

  - job_name: cadvisor
    file_sd_configs:
      - files: ["/etc/prometheus/file_sd/cadvisor.yml"]
        refresh_interval: 5m

  - job_name: pve
    metrics_path: /pve
    params:
      module: [default]
      cluster: ["1"]
      node: ["1"]
    file_sd_configs:
      - files: ["/etc/prometheus/file_sd/proxmox.yml"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221

  - job_name: synology-snmp
    scrape_interval: 120s
    scrape_timeout: 30s
    metrics_path: /snmp
    params:
      auth: [synology_v3]
      module: [synology]
    file_sd_configs:
      - files: ["/etc/prometheus/file_sd/synology.yml"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  - job_name: blackbox-https
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: ["/etc/prometheus/file_sd/http.yml"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-proxmox
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [http_2xx_internal_tls]
    file_sd_configs:
      - files: ["/etc/prometheus/file_sd/proxmox-http.yml"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-icmp
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [icmp]
    file_sd_configs:
      - files: ["/etc/prometheus/file_sd/icmp.yml"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-dns
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [dns_lab]
    file_sd_configs:
      - files: ["/etc/prometheus/file_sd/dns.yml"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
