---
groups:
  - name: availability
    rules:
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Metrics target {{ $labels.instance }} is down"
          description: "Prometheus has failed to scrape {{ $labels.job }} for five minutes."

      - alert: EndpointDown
        expr: probe_success == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Probe failed for {{ $labels.instance }}"
          description: "The HTTP, ICMP, or DNS probe has failed continuously for three minutes."

      - alert: CertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) < 14 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate expires soon for {{ $labels.instance }}"
          description: "The observed certificate expires in less than 14 days."

      - alert: DnsResolutionFailed
        expr: probe_success{job="blackbox-dns"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Split-horizon DNS failed via {{ $labels.instance }}"
          description: "home.lab.example.com did not resolve to the expected private address."
