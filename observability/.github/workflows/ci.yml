---
name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install controller tools
        run: |
          python -m pip install -r requirements.txt
          ansible-galaxy collection install -r requirements.yml
      - name: Run offline checks
        run: |
          make lint
          make test
      - name: Validate Compose model
        run: docker compose --file docker/compose.yml --env-file docker/.env.example config --quiet
      - name: Validate Prometheus configuration
        run: |
          docker run --rm -v "$PWD/config/prometheus:/etc/prometheus:ro" prom/prometheus:v3.12.0 \
            promtool check config /etc/prometheus/prometheus.yml
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
